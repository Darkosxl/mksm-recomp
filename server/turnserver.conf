# coturn (4.6.x) for the MKSM site. Template: deploy.sh renders @TURN_SECRET@, @REALM@ and EXTERNAL_IP into
# /etc/turnserver.conf on the VPS; the real secret never lives in the repo.

# Plain STUN/TURN on 3478 udp+tcp. WebRTC encrypts media itself, so no TLS/DTLS listeners.
listening-port=3478
no-tls
no-dtls

# Behind 1:1 NAT (AWS/GCP etc.) the public IP is not on an interface: deploy.sh EXTERNAL_IP=<public>/<private> fills this
#external-ip=203.0.113.10/10.0.0.5

# Relay ports; must match the firewall (49160-49200/udp).
min-port=49160
max-port=49200

# Time-limited REST credentials minted by signal.mjs with the shared secret.
fingerprint
use-auth-secret
static-auth-secret=@TURN_SECRET@
realm=@REALM@
stale-nonce=600

# Quotas: 41 relay ports total, a handful per credential.
total-quota=40
user-quota=8

# UDP relays only; WebRTC never asks for RFC 6062 TCP relays.
no-tcp-relay
no-multicast-peers
no-cli

# Reflection/amplification hardening.
no-rfc5780
no-stun-backward-compatibility
response-origin-only-with-rfc5780
no-software-attribute

# Never relay into private, loopback, link-local, CGNAT, documentation or reserved space.
# (The VPS's own public IP stays allowed: two peers relayed by this server reach each other through it.)
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.0.2.0-192.0.2.255
denied-peer-ip=192.88.99.0-192.88.99.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=198.51.100.0-198.51.100.255
denied-peer-ip=203.0.113.0-203.0.113.255
denied-peer-ip=224.0.0.0-255.255.255.255
denied-peer-ip=::
denied-peer-ip=::1
denied-peer-ip=::ffff:0:0-::ffff:ffff:ffff
denied-peer-ip=64:ff9b::-64:ff9b::ffff:ffff
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# Log to syslog/journal only, without verbose mode (no per-packet or credential detail).
syslog
no-stdout-log
